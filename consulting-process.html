<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>보험 상담 프로세스 | 준비중</title>
<link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#0f1b35;--blue:#2563eb;--blue-light:#3b82f6;
    --purple:#7c3aed;--purple-light:#8b5cf6;
    --text2:#64748b;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{height:100%;}
  body{
    font-family:'Pretendard',sans-serif;color:#fff;
    background:
      radial-gradient(1200px 600px at 10% -10%, rgba(124,58,237,.18), transparent 60%),
      radial-gradient(1200px 600px at 100% 110%, rgba(37,99,235,.18), transparent 60%),
      var(--navy);
    min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:32px 20px;text-align:center;
  }
  .icon{
    width:76px;height:76px;border-radius:22px;margin-bottom:26px;
    background:linear-gradient(135deg,var(--purple),var(--purple-light));
    display:flex;align-items:center;justify-content:center;font-size:36px;
    box-shadow:0 20px 40px -12px rgba(124,58,237,.5);
  }
  h1{font-size:26px;font-weight:800;letter-spacing:-.3px;}
  p{font-size:14px;color:rgba(255,255,255,.55);margin-top:12px;line-height:1.7;max-width:380px;}
  .badge{
    margin-top:22px;font-size:11.5px;font-weight:700;letter-spacing:.5px;
    padding:6px 14px;border-radius:20px;background:rgba(255,255,255,.08);color:rgba(255,255,255,.7);
  }
  .back{
    margin-top:34px;display:inline-flex;align-items:center;gap:6px;
    font-size:13px;font-weight:700;color:#fff;text-decoration:none;
    padding:11px 20px;border-radius:12px;background:rgba(255,255,255,.08);
    border:1px solid rgba(255,255,255,.12);transition:background .2s ease;
  }
  .back:hover{background:rgba(255,255,255,.15);}
</style>
</head>
<body>

  <div class="icon">🗂️</div>
  <h1>보험 상담 프로세스</h1>
  <p>상담 단계별 가이드와 체크리스트를 제공하는 서비스를 준비하고 있습니다.<br>조금만 기다려 주세요.</p>
  <div class="badge">🚧 COMING SOON</div>
  <a class="back" href="index.html">← 허브로 돌아가기</a>

</body>
</html>
