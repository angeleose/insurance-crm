<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>보험 서비스 허브</title>
<link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#0f1b35;--navy2:#1a2d52;--blue:#2563eb;--blue-light:#3b82f6;
    --purple:#7c3aed;--purple-light:#8b5cf6;
    --bg:#f0f4f9;--card:#ffffff;--text:#0f1b35;--text2:#64748b;--border:#e2e8f0;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{height:100%;}
  body{
    font-family:'Pretendard',sans-serif;color:var(--text);
    background:
      radial-gradient(1200px 600px at 10% -10%, rgba(37,99,235,.15), transparent 60%),
      radial-gradient(1200px 600px at 100% 110%, rgba(124,58,237,.15), transparent 60%),
      var(--navy);
    min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:32px 20px;
  }
  .hub-header{text-align:center;margin-bottom:44px;}
  .hub-eyebrow{font-size:12px;font-weight:700;letter-spacing:2px;color:rgba(255,255,255,.45);text-transform:uppercase;margin-bottom:14px;}
  .hub-title{font-size:32px;font-weight:800;color:#fff;letter-spacing:-.5px;}
  .hub-title span{background:linear-gradient(90deg,var(--blue-light),var(--purple-light));-webkit-background-clip:text;background-clip:text;color:transparent;}
  .hub-sub{font-size:14px;color:rgba(255,255,255,.5);margin-top:10px;}

  .hub-grid{display:grid;grid-template-columns:repeat(2,minmax(240px,300px));gap:22px;width:100%;max-width:660px;}
  @media (max-width:600px){.hub-grid{grid-template-columns:1fr;}}

  .hub-card{
    position:relative;overflow:hidden;
    background:var(--card);border-radius:20px;padding:32px 26px;
    text-decoration:none;color:var(--text);
    box-shadow:0 20px 40px -12px rgba(0,0,0,.35);
    transition:transform .2s ease, box-shadow .2s ease;
    display:flex;flex-direction:column;gap:14px;
    border:1px solid rgba(255,255,255,.08);
  }
  .hub-card:hover{transform:translateY(-6px);box-shadow:0 28px 50px -12px rgba(0,0,0,.45);}
  .hub-card:active{transform:translateY(-2px);}
  .hub-card .icon{
    width:52px;height:52px;border-radius:14px;display:flex;align-items:center;justify-content:center;
    font-size:26px;
  }
  .hub-card.crm .icon{background:linear-gradient(135deg,var(--blue),var(--blue-light));}
  .hub-card.process .icon{background:linear-gradient(135deg,var(--purple),var(--purple-light));}
  .hub-card h2{font-size:18px;font-weight:800;letter-spacing:-.3px;}
  .hub-card p{font-size:12.5px;color:var(--text2);line-height:1.6;}
  .hub-card .go{
    margin-top:auto;display:flex;align-items:center;gap:6px;
    font-size:12.5px;font-weight:700;
  }
  .hub-card.crm .go{color:var(--blue);}
  .hub-card.process .go{color:var(--purple);}
  .hub-card .go .arrow{transition:transform .2s ease;}
  .hub-card:hover .go .arrow{transform:translateX(4px);}

  .hub-badge{
    position:absolute;top:16px;right:16px;font-size:10.5px;font-weight:700;
    padding:4px 9px;border-radius:20px;letter-spacing:.3px;
  }
  .hub-badge.ready{background:#dcfce7;color:#15803d;}
  .hub-badge.soon{background:#f1f5f9;color:#64748b;}

  .hub-footer{margin-top:40px;font-size:11.5px;color:rgba(255,255,255,.3);}
</style>
</head>
<body>

  <div class="hub-header">
    <div class="hub-eyebrow">Insurance Service Hub</div>
    <div class="hub-title">보험 <span>서비스 허브</span></div>
    <div class="hub-sub">이용하실 서비스를 선택해 주세요.</div>
  </div>

  <div class="hub-grid">
    <a class="hub-card crm" href="crm.html">
      <span class="hub-badge ready">이용 가능</span>
      <div class="icon">📋</div>
      <h2>보험 CRM</h2>
      <p>고객·계약 관리, 상담 이력, 대시보드 등 보험설계사를 위한 고객관리 시스템입니다.</p>
      <div class="go">로그인하고 시작하기 <span class="arrow">→</span></div>
    </a>

    <a class="hub-card process" href="consulting-process.html">
      <span class="hub-badge soon">준비중</span>
      <div class="icon">🗂️</div>
      <h2>보험 상담 프로세스</h2>
      <p>상담 단계별 가이드와 체크리스트를 제공하는 서비스입니다. 곧 만나보실 수 있어요.</p>
      <div class="go">자세히 보기 <span class="arrow">→</span></div>
    </a>
  </div>

  <div class="hub-footer">© 2026 Insurance Service Hub</div>

</body>
</html>
